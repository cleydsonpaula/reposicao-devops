services:
  web:
    build: .                      # monta a imagem a partir do Dockerfile desta pasta
    image: reposicao-devops:local
    container_name: devops-web
    ports:
      - "8090:80"                 # navegador: http://localhost:8090
    environment:
      DB_HOST: db
      DB_NAME: simples
      DB_USER: simples
      DB_PASS: simples
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: devops-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: simples
      MYSQL_USER: simples
      MYSQL_PASSWORD: simples
    volumes:
      - devops-dados:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
volumes:
  devops-dados:
